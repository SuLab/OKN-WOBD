[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okn-wobd"
version = "0.1.0"
description = "Utilities for interacting with the NIAID data API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "requests>=2.31,<3",
    "rdflib>=7.0,<8",
    "PyYAML>=6.0.1",
    "pandas>=2.0",
    "mcp>=1.6.0",
    "anthropic>=0.39",
    "SPARQLWrapper>=2.0",
]

[project.optional-dependencies]
chatgeo = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydeseq2>=0.4",
    "gprofiler-official>=1.0",
    "h5py>=3.8",
]
cellxgene = [
    "cellxgene-census>=1.0",
]
viz = [
    "plotly>=5.0",
]
all = [
    "okn-wobd[chatgeo,cellxgene,viz]",
]

[project.scripts]
okn-wobd = "okn_wobd.cli:main"
okn-wobd-mcp = "okn_wobd.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]


