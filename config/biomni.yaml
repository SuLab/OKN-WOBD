# Biomni MCP server configuration for OKN-WOBD
# See: https://github.com/anthropics/biomni
#
# Edit the cwd path below to match your checkout.
name: okn-wobd
description: >
  Biomedical analysis tools for gene-disease path finding, gene neighborhood
  queries, and differential expression analysis via ARCHS4.
transport: stdio
command: python3.11
args:
  - "-m"
  - okn_wobd.mcp_server
cwd: /path/to/OKN-WOBD
